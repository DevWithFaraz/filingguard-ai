services:
  - type: web
    name: filingguard-api
    runtime: python
    plan: free
    # Keep the repository root available: curated demo resources live in data/demo.
    buildCommand: pip install uv==0.12.15 && uv sync --directory apps/api --locked --no-dev
    startCommand: apps/api/.venv/bin/uvicorn filingguard.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: UV_PYTHON_DOWNLOADS
        value: never
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      # Public intake stays closed until the deployment guide's hosted gates pass.
      - key: INTAKE_ENABLED
        value: "false"
      - key: SOURCE_VERIFICATION_ENABLED
        value: "false"
      - key: SEMANTIC_REVIEW_ENABLED
        value: "false"
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: ANALYSIS_TIMEOUT_SECONDS
        value: "90"
      - key: REVIEW_STAGE_TIMEOUT_SECONDS
        value: "60"
      - key: CLEANUP_INTERVAL_SECONDS
        value: "60"
  - type: web
    name: filingguard-web
    runtime: static
    buildCommand: npm ci --ignore-scripts && npm run build
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
